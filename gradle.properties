# Memoria para o Gradle e o daemon do Kotlin: o heap padrao (512 MB) estoura ao juntar
# o dex do app (mergeExtDexDebug) por causa das bibliotecas do Compose e do build-engine.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# O app usa bibliotecas androidx.* (Compose, Activity, Lifecycle); sem isto o AGP
# falha em checkDebugAarMetadata.
android.useAndroidX=true

kotlin.code.style=official
